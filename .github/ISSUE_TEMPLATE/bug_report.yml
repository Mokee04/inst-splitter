name: Bug Report
description: File a bug report to help us improve inst-splitter
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command 'inst-split "input.flac" -5'
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, GPU / Apple Silicon hardware, etc.
      placeholder: |
        - OS: macOS 14.5 (Apple Silicon M2 Max) / Ubuntu 22.04
        - Python version: 3.11.8
        - GPU / Hardware: Apple Silicon MPS / NVIDIA RTX 4090
        - inst-splitter version: 1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output with `--debug` flag.
      render: shell
